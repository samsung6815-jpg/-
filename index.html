<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<title>Angle · Pose · Expression Randomizer</title>
<style>
:root{color-scheme:dark;--bg:#0b0d12;--panel:#121620;--panel2:#171c27;--line:#283040;--text:#f4f7fb;--muted:#99a3b4;--accent:#8b9cff;--accent2:#b7c0ff;--good:#78e0b1;--shadow:0 18px 50px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 50% -10%,#1a2040 0,#0b0d12 40%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;min-height:100vh}
button,select,textarea{font:inherit}button{cursor:pointer}.app{width:min(1180px,100%);margin:auto;padding:18px 14px 42px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:clamp(22px,5vw,34px);margin:0;letter-spacing:-.04em}.sub{color:var(--muted);font-size:13px;margin-top:6px}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:11px 13px;font-weight:750;transition:.15s transform,.15s background,.15s border-color}.btn:active{transform:scale(.98)}.btn:hover{border-color:#3d4860}.btn.primary{background:var(--accent);color:#0b0d12;border-color:transparent}.btn.big{width:100%;font-size:19px;padding:16px 18px;border-radius:16px;box-shadow:var(--shadow)}.btn.ghost{background:transparent}
.controlbar{display:grid;grid-template-columns:1fr;gap:9px;margin:12px 0}.mini-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.results{display:grid;gap:10px;margin:12px 0 18px}.card{background:linear-gradient(180deg,rgba(23,28,39,.98),rgba(15,18,25,.98));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}.card.locked{border-color:#596487;box-shadow:0 0 0 1px rgba(139,156,255,.1),var(--shadow)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.label{font-size:12px;letter-spacing:.16em;font-weight:900;color:var(--accent2)}.lock{border:1px solid var(--line);background:#0d1118;color:var(--muted);border-radius:10px;padding:8px 10px}.lock.on{color:var(--good);border-color:#3c7560}
.result{font-size:clamp(17px,3.7vw,24px);line-height:1.55;letter-spacing:-.025em;white-space:pre-wrap}.meta{color:var(--muted);font-size:12px;margin-top:10px}.card-actions{display:flex;gap:8px;margin-top:13px}.card-actions .btn{flex:1}
.workspace{display:grid;gap:12px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.tools .btn{min-height:44px}
.category-row{display:flex;align-items:center;gap:8px;margin:0 0 8px}.category-row label{font-size:12px;color:var(--muted);white-space:nowrap}.category-row select{width:100%;background:#0d1118;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px}
.prompt-panel{display:none;margin-top:12px}.prompt-panel.show{display:block}.prompt-panel textarea{width:100%;min-height:210px;resize:vertical;background:#0a0d13;color:#eef1f7;border:1px solid var(--line);border-radius:14px;padding:14px;line-height:1.6}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translate(-50%,130%);background:#eef1f7;color:#0b0d12;padding:11px 15px;border-radius:999px;font-weight:800;box-shadow:var(--shadow);transition:.2s;z-index:10}.toast.show{transform:translate(-50%,0)}
footer{color:#737d8d;text-align:center;font-size:12px;padding:24px 0}
@media(min-width:760px){.app{padding:28px 22px 54px}.controlbar{grid-template-columns:1fr auto}.mini-actions{grid-template-columns:repeat(3,auto)}.results{grid-template-columns:repeat(3,1fr);align-items:stretch}.card{min-height:250px;display:flex;flex-direction:column}.result{flex:1}.workspace{grid-template-columns:1fr}.tools{grid-template-columns:repeat(4,1fr)}}
@media(max-width:560px){header{display:block}.top-actions{margin-top:12px}.top-actions .btn{flex:1}.mini-actions{grid-template-columns:1fr}.result{font-size:18px}.card{padding:14px}.tools{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main class="app">
<header>
  <div><h1>Angle · Pose · Expression</h1><div class="sub">캐릭터 일러스트 아이디어를 위한 오프라인 랜덤 조합기 · 포즈 240개 · 표정 76개</div></div>
  <div class="top-actions"><button class="btn ghost" id="historyBtn" title="직전 결과로 돌아가기">↶ 이전 결과</button></div>
</header>
<section class="controlbar">
  <button class="btn primary big" id="allBtn">🎲 모두 랜덤</button>
  <div class="mini-actions"><button class="btn" id="angleBtn">ANGLE만</button><button class="btn" id="poseBtn">POSE만</button><button class="btn" id="exprBtn">표정만</button></div>
</section>
<section class="results">
  <article class="card" id="angleCard"><div class="card-head"><div class="label">ANGLE</div><button class="lock" id="angleLock">🔓 잠금</button></div><div class="result" id="angleResult"></div><div class="meta">방향 · 높이 · 거리 · 렌즈 · 프레이밍을 독립 조합</div><div class="card-actions"><button class="btn" id="angleReroll">↻ 앵글 다시</button></div></article>
  <article class="card" id="poseCard"><div class="card-head"><div class="label">POSE</div><button class="lock" id="poseLock">🔓 잠금</button></div><div class="category-row"><label for="poseCategory">카테고리</label><select id="poseCategory"></select></div><div class="result" id="poseResult"></div><div class="meta" id="poseMeta"></div><div class="card-actions"><button class="btn" id="poseReroll">↻ 포즈 다시</button></div></article>
  <article class="card" id="exprCard"><div class="card-head"><div class="label">EXPRESSION</div><button class="lock" id="exprLock">🔓 잠금</button></div><div class="category-row"><label for="exprCategory">카테고리</label><select id="exprCategory"></select></div><div class="result" id="exprResult"></div><div class="meta" id="exprMeta"></div><div class="card-actions"><button class="btn" id="exprReroll">↻ 표정 다시</button></div></article>
</section>
<section class="workspace">
  <div class="tools"><button class="btn" id="copyBtn">⧉ 결과 복사</button><button class="btn" id="promptBtn">✦ 이미지 프롬프트로 변환</button><button class="btn" id="rerollBtn">⟳ 다시 돌리기</button><button class="btn" id="copyPromptBtn">⧉ 프롬프트 복사</button></div>
  <div class="prompt-panel" id="promptPanel"><textarea id="promptText" spellcheck="false"></textarea></div>
</section>
<footer>완전한 단일 HTML · 외부 라이브러리/서버/API 없음 · GitHub Pages에서 index.html 하나로 실행 가능</footer>
</main>
<div class="toast" id="toast"></div>
<script>
const POSES = {"정적":["한쪽 다리에 체중을 싣고 반대쪽 무릎을 가볍게 굽힌 채 어깨를 편안하게 내린 자세","두 발을 어깨너비로 벌리고 양손을 뒤로 모은 채 턱을 살짝 들어 먼 곳을 바라보는 자세","한 발을 반 걸음 앞으로 내밀고 상체를 약간 틀어 옆모습과 정면의 중간 각도를 만드는 자세","발끝은 서로 다른 방향을 향하고 한쪽 어깨를 뒤로 빼면서 고개만 카메라 쪽으로 돌린 자세","양팔을 자연스럽게 늘어뜨린 채 손가락에 힘을 빼고 한쪽 발뒤꿈치를 살짝 들어 올린 자세","한쪽 팔을 허리에 얹고 반대쪽 팔은 느슨하게 내려 몸의 중심을 한쪽 골반으로 옮긴 자세","두 손을 가슴 앞에서 가볍게 맞잡고 팔꿈치를 벌린 채 목과 어깨의 긴장을 푼 자세","한쪽 무릎을 세우고 다른 다리를 곧게 뻗어 발끝을 바깥쪽으로 돌린 채 옆을 향해 서 있는 자세","상체를 곧게 세우되 골반을 한쪽으로 살짝 밀고 머리는 반대 방향으로 기울인 자세","양손을 주머니에 넣고 한쪽 발을 뒤로 끌어 발끝만 바닥에 닿게 한 채 서 있는 자세","팔짱을 끼고 한쪽 다리를 다른 다리 앞에 교차시킨 채 체중을 뒤꿈치에 둔 자세","한 손으로 반대쪽 팔꿈치를 받치고 다른 손은 턱 아래에 둔 채 생각에 잠긴 듯 멈춰 있는 자세"],"걷기":["뒤를 돌아보면서도 보폭을 유지해 앞발을 내딛고 있는 순간","한 손으로 옷자락을 잡은 채 바람을 가르며 빠른 걸음으로 앞으로 나아가는 순간","계단을 내려오며 한쪽 발을 낮은 계단에 먼저 디디고 몸을 앞으로 기울인 순간","보도 가장자리에서 차를 피하듯 한 걸음 옆으로 이동하면서 고개를 진행 방향으로 돌린 순간","친구를 발견하고 걸음을 늦추며 한 발을 반쯤 들어 올린 채 상체를 뒤로 젖힌 순간","좁은 복도를 지나기 위해 어깨를 살짝 움츠리고 한쪽 팔을 앞에 내밀며 걷는 자세","무거운 가방 때문에 한쪽 어깨가 내려간 채 보폭을 짧게 줄여 걷는 순간","빗물을 피하려 빠르게 걸으며 한 손으로 머리 위를 가리고 다른 손은 균형을 잡는 순간","뒤에서 누군가 부르는 소리에 발은 계속 앞으로 향한 채 상체와 머리만 뒤로 돌린 순간","미끄러운 바닥을 조심하며 발바닥을 넓게 디디고 팔을 낮게 벌린 채 천천히 걷는 자세","난간을 따라 걸으며 한 손끝으로 난간을 스치고 시선은 아래쪽을 따라가는 순간","발밑의 작은 장애물을 넘기 위해 한쪽 무릎을 높이고 반대팔을 앞으로 휘두르는 순간"],"달리기":["빠르게 달리다가 갑자기 방향을 바꾸며 한쪽 발을 축으로 몸통을 회전시키는 순간","전력질주하며 앞쪽 팔꿈치를 강하게 당기고 반대쪽 무릎을 허리 높이까지 끌어올린 순간","내리막길을 달리며 속도를 제어하려 상체를 뒤로 조금 젖힌 순간","뒤에서 따라오는 사람을 확인하려 달리는 리듬을 유지한 채 머리만 뒤로 돌린 순간","장애물을 넘기 직전 한쪽 팔을 앞으로 뻗고 양발을 동시에 지면에서 떼려는 순간","젖은 바닥에서 미끄러지지 않으려 보폭을 급히 줄이고 팔을 좌우로 크게 휘두르는 순간","좁은 골목 모퉁이를 돌며 바깥쪽 발을 넓게 디디고 어깨부터 회전시키는 순간","가방을 붙잡고 달리면서 가방이 흔들리지 않도록 한쪽 팔꿈치를 몸통에 고정한 자세","출발 신호 직후 몸을 앞으로 깊게 숙이고 뒷발로 지면을 강하게 밀어내는 순간","달리다 멈추기 위해 뒤꿈치를 먼저 내리고 무릎을 굽히며 상체를 뒤로 당기는 순간","긴 계단을 두 칸씩 뛰어오르며 한 손으로 난간을 잡고 반대쪽 무릎을 높게 올리는 순간","추격을 피하듯 뒤를 확인한 직후 다시 정면으로 몸을 틀며 속도를 높이는 순간"],"역동적인 동작":["몸을 크게 비틀며 한 팔을 위로 휘두르고 반대쪽 다리를 대각선 뒤로 뻗는 동작","공중에서 몸통을 반 바퀴 틀어 한쪽 팔을 아래로 내리고 두 무릎을 서로 다른 높이로 접은 순간","긴 막대기를 휘두르는 듯 상체와 골반을 동시에 회전시키며 뒷발을 따라 돌리는 동작","균형을 잃었다가 회복하려 두 팔을 크게 원형으로 휘젓고 한 발을 급히 옆으로 내딛는 순간","몸을 낮춘 상태에서 한쪽 어깨를 앞으로 밀어 넣으며 반대쪽 팔을 황":["실수를 깨닫고 눈을 크게 뜬 채 순간적으로 얼굴이 굳은 표정","시선이 좌우로 흔들리고 입술이 반쯤 열린 어색한 표정","눈썹이 들리고 입꼬리가 어색하게 멈춘 채 무슨 말을 해야 할지 모르는 표정","얼굴이 굳었다가 급히 시선을 피하며 당황을 숨기려는 표정"],"민망":["시선을 아래로 피하고 입술을 꾹 다물며 귀까지 붉어진 듯한 표정","한 손으로 입가를 가리듯 웃음을 숨기며 눈을 옆으로 돌린 표정","눈썹을 살짝 내리고 작게 웃으면서도 정면을 제대로 보지 못하는 표정","어색한 미소를 지으며 턱을 살짝 당기고 상대와 눈을 마주치지 않는 표정"],"자신감":["턱을 살짝 들고 눈을 똑바로 맞추며 입꼬리를 미세하게 올린 자신감 있는 표정","눈썹을 안정적으로 유지하고 입술을 단단히 다문 결의에 찬 표정","상대를 정면으로 바라보며 한쪽 입꼬리만 올린 여유로운 표정","눈빛을 선명하게 고정하고 턱선을 또렷하게 세운 당당한 표정"],"피로":["눈꺼풀이 무겁게 내려오고 입술이 살짝 벌어진 지친 표정","하품을 참는 듯 눈가에 힘이 없고 턱이 조금 처진 표정","초점이 살짝 흐려지고 눈썹이 축 처진 장시간 활동 후의 표정","입꼬리가 자연스럽게 내려가고 눈을 반쯤 감은 무기력한 표정"],"멍함":["시선이 한곳에 고정되지 않고 초점이 먼 곳에 머문 듯한 멍한 표정","입술을 살짝 벌린 채 눈동자의 움직임이 느리고 반응이 늦은 표정","무슨 생각을 하는지 알 수 없게 얼굴 근육이 거의 움직이지 않는 표정","눈을 크게 뜨고도 상황을 아직 받아들이지 못한 듯한 공백 어린 표정"],"집중":["눈을 가늘게 뜨고 작은 움직임까지 따라가며 시선을 한 점에 고정한 표정","눈썹을 살짝 모으고 입술을 다문 채 복잡한 문제를 생각하는 표정","턱을 약간 당기고 눈동자를 빠르게 움직이며 정보를 분석하는 표정","주변 소리를 잊은 듯 시선을 고정하고 얼굴 전체에 긴장이 모인 집중된 표정"]};
const ANGLES = {"direction":["정면","전방 3/4 좌측","전방 3/4 우측","완전 좌측면","완전 우측면","후방 3/4 좌측","후방 3/4 우측","정후면"],"height":["눈높이","약한 로우앵글","강한 로우앵글","바닥 가까운 극단적 로우앵글","약한 하이앵글","강한 하이앵글","버드아이뷰"],"distance":["얼굴 클로즈업","바스트숏","미디엄숏","니숏","풀바디숏","환경을 포함한 롱숏"],"lens":["20mm 초광각","24mm 광각","28mm 광각","35mm 준광각","50mm 표준","65mm 준망원","85mm 인물 망원","105mm 압축 망원"],"framing":["안정적인 프레이밍","더치앵글","추적숏","스냅숏","강한 원근 프레이밍","깊은 공간감","압축된 망원 구도"]};
const state={angle:null,pose:null,expression:null,locks:{angle:false,pose:false,expression:false},poseCategory:"전체",expressionCategory:"전체",previous:null};
const $=id=>document.getElementById(id);
const pick=(arr,last)=>{if(arr.length<2)return arr[0];let x;do{x=arr[Math.floor(Math.random()*arr.length)]}while(x===last);return x};
const categories=obj=>Object.keys(obj);
const flat=(obj,cat)=>cat==="전체"?Object.values(obj).flat():obj[cat]||[];
function randomAngle(){const out={};for(const k of ["direction","height","distance","lens","framing"])out[k]=pick(ANGLES[k],state.angle?.[k]);state.angle=out}
function randomPose(){state.pose=pick(flat(POSES,state.poseCategory),state.pose)}
function randomExpression(){state.expression=pick(flat(EXPRESSIONS,state.expressionCategory),state.expression)}
function snapshot(){return JSON.parse(JSON.stringify({angle:state.angle,pose:state.pose,expression:state.expression}))}
function savePrevious(){state.previous=snapshot()}
function render(){
  $("angleResult").textContent=[state.angle.direction,state.angle.height,state.angle.distance,state.angle.lens,state.angle.framing].join("\n");
  $("poseResult").textContent=state.pose;$("exprResult").textContent=state.expression;
  $("poseMeta").textContent=state.poseCategory==="전체"?"전체 240개":`${state.poseCategory} · ${POSES[state.poseCategory].length}개`;
  $("exprMeta").textContent=state.expressionCategory==="전체"?"전체 76개":`${state.expressionCategory} · ${EXPRESSIONS[state.expressionCategory].length}개`;
  for(const key of ["angle","pose","expression"]){$(key+"Card").classList.toggle("locked",state.locks[key]);const b=$(key+"Lock");b.classList.toggle("on",state.locks[key]);b.textContent=state.locks[key]?"🔒 잠김":"🔓 잠금"}
}
function randomAll(){savePrevious();if(!state.locks.angle)randomAngle();if(!state.locks.pose)randomPose();if(!state.locks.expression)randomExpression();render();flash("새 조합 생성")}
function randomOne(key){savePrevious();if(key==="angle"&&!state.locks.angle)randomAngle();if(key==="pose"&&!state.locks.pose)randomPose();if(key==="expression"&&!state.locks.expression)randomExpression();render()}
function initSelect(id,obj){const sel=$(id);sel.innerHTML="";["전체",...categories(obj)].forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;sel.appendChild(o)})}
function makePrompt(){return `카메라:
${state.angle.direction}, ${state.angle.height}, ${state.angle.distance}, ${state.angle.lens}, ${state.angle.framing}.

포즈:
${state.pose}.

표정:
${state.expression}.

자연스러운 체중 중심과 관절 방향, 명확한 실루엣, 카메라 방향과 포즈가 서로 일치하도록 구성.`}
async function copyText(text){try{await navigator.clipboard.writeText(text);flash("복사했습니다")}catch(e){const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();flash("복사했습니다")}}
function flash(t){const el=$("toast");el.textContent=t;el.classList.add("show");clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1300)}
initSelect("poseCategory",POSES);initSelect("exprCategory",EXPRESSIONS);
$("poseCategory").addEventListener("change",e=>{state.poseCategory=e.target.value;randomOne("pose")});
$("exprCategory").addEventListener("change",e=>{state.expressionCategory=e.target.value;randomOne("expression")});
$("allBtn").onclick=randomAll;$("rerollBtn").onclick=randomAll;$("angleBtn").onclick=()=>randomOne("angle");$("poseBtn").onclick=()=>randomOne("pose");$("exprBtn").onclick=()=>randomOne("expression");
$("angleReroll").onclick=()=>randomOne("angle");$("poseReroll").onclick=()=>randomOne("pose");$("exprReroll").onclick=()=>randomOne("expression");
for(const key of ["angle","pose","expression"])$(key+"Lock").onclick=()=>{state.locks[key]=!state.locks[key];render()};
$("copyBtn").onclick=()=>copyText(`ANGLE
${state.angle.direction}, ${state.angle.height}, ${state.angle.distance}, ${state.angle.lens}, ${state.angle.framing}

POSE
${state.pose}

EXPRESSION
${state.expression}`);
$("promptBtn").onclick=()=>{$("promptText").value=makePrompt();$("promptPanel").classList.add("show");$("promptText").focus()};
$("copyPromptBtn").onclick=()=>copyText(makePrompt());
$("historyBtn").onclick=()=>{if(!state.previous){flash("이전 결과가 없습니다");return}const cur=snapshot();state.angle=state.previous.angle;state.pose=state.previous.pose;state.expression=state.previous.expression;state.previous=cur;render();flash("이전 결과로 복원")};
document.addEventListener("keydown",e=>{if(e.target.matches("textarea,select"))return;if(e.code==="Space"){e.preventDefault();randomAll()}if(e.key.toLowerCase()==="a")randomOne("angle");if(e.key.toLowerCase()==="p")randomOne("pose");if(e.key.toLowerCase()==="e")randomOne("expression")});
randomAngle();randomPose();randomExpression();render();
</script>
</body>
</html>
